<Html>
    <head>
        <Title>
            Job Application Form 
        </Title>
    </head>
    <body>
        <fieldset>
        <Legend><h2>Job Application Form </h2> 
        </Legend>
        <Form>

           <Lable for="FullName">FullName:</Lable>
           <input type="Full name" id="Full Name" required> <br></br>

           <label for="Father Name">FatherName</label>
           <input type="Father name"id="Father name" required > <br></br>

           <label for="Number">Age</label>
           <input type="number" id="Age" min="20" max="40" required> <br></br>
           
           <label for="Mobile no">Mobile no</label>
           <input type="Mobile no" id="Mobile" required> <br></br>

           <label for="Email">email</label>
           <input type="email" id="email" required> <br><br>

           <label for="Positions">Qualification </label>
           <select name="Qualification" id="/Qualification">
           <option value="Master">Master</option>
           <option value="Bachler">Bachler</option>
           <option value="Matric">Matric</option required> </select><br><br>

            
            <label for="Division">Division</label>
            <select name="Division" id="Division">
            <option value="Makran Division">Makran</option>
            <option value="Zhob Division">Zhob</option>
            <option value="Naseerabad Division">Naseerabad</option>
            <option value="Koh e Suleman Division">Koh e Suleman</option required> <br><br>
          </select> <br><br>

            <label for="Positions">Positions</label> 
            <select name="Positions" id="Positions" required> <br><br>
            <option value="Juniorclerk">Juniorclerk</option>
            <option value="Assistant">Assistant</option>
            <option value="Superintendent">Superintendent</option>
            <option value="SeniorClerk">SeniorClerk</option>
            <option value="Khakroob">Khakroob</option>
            <option value="Sweeper">Sweeper</option required> <br><br> 
            </select>
            <h1><button>Submit</button></h1>
        </Form>
    </body>
</Html>
